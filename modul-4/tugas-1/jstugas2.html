<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tugas 2 - Kalkulator Sederhana</title>
</head>
<body>
    <h2>Kalkulator Sederhana</h2>
    Angka 1: <input type="number" id="angka1"><br><br>
    Angka 2: <input type="number" id="angka2"><br><br>
    <input type="button" value="+" onClick="hitung('+')">
    <input type="button" value="-" onClick="hitung('-')">
    <input type="button" value="x" onClick="hitung('*')">
    <input type="button" value="/" onClick="hitung('/')">
    <p id="hasil"></p>
    <script>
        function hitung(operator) {
            const a = document.getElementById("angka1").value;
            const b = document.getElementById("angka2").value;
            const hasil = document.getElementById("hasil");

            if (a === "" || b === "") {
                hasil.innerHTML = "Kedua angka harus diisi!";
                return;
            }

            const x = Number(a);
            const y = Number(b);
            let total;

            if (operator == "+") {
                total = x + y;
            } else if (operator == "-") {
                total = x - y;
            } else if (operator == "*") {
                total = x * y;
            } else if (operator == "/") {
                if (y == 0) {
                    hasil.innerHTML = "Tidak bisa membagi dengan nol!";
                    return;
                }
                total = x / y;
            }

            hasil.innerHTML = x + " " + operator + " " + y + " = <b>" + total + "</b>";
        }
    </script>
</body>
</html>
