<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tugas 1 - Pengambil Keputusan Nilai</title>
</head>
<body>
    <h2>Konversi Nilai ke Huruf</h2>
    Masukkan nilai (0-100):
    <input type="number" id="nilai" min="0" max="100">
    <input type="button" value="Cek Nilai" onClick="cekNilai()">
    <p id="hasil"></p>
    <script>
        function cekNilai() {
            const input = document.getElementById("nilai");
            const hasil = document.getElementById("hasil");
            const nilai = Number(input.value);
            let grade;

            if (input.value === "" || isNaN(nilai) || nilai < 0 || nilai > 100) {
                hasil.innerHTML = "Masukkan nilai yang valid antara 0 sampai 100!";
                return;
            }

            if (nilai <= 20) {
                grade = "E";
            } else if (nilai <= 40) {
                grade = "D";
            } else if (nilai <= 60) {
                grade = "C";
            } else if (nilai <= 80) {
                grade = "B";
            } else {
                grade = "A";
            }

            hasil.innerHTML = "Nilai " + nilai + " = <b>" + grade + "</b>";
        }
    </script>
</body>
</html>
