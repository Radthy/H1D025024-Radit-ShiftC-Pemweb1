<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Kotak</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .container {
                width: 500px;
                display: flex;
                flex-direction: column;
                gap: 1px;
            }
            .header {
                height: 80px;
                border: 2px solid black;
            }
            .content {
                height: 320px;
                border: 2px solid black;
            }
            .footer {
                height: 30px;
                border: 2px solid black;
            }
        </style>
    </head>
    <body>
        <div class="container">
            
            <div class="header"></div>
            <div class="content"></div>
            <div class="footer"></div>
        </div>
    </body>
</html>
